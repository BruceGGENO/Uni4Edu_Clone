<!DOCTYPE html>
<html>

<head>
    <title>Uni4Edu Study Abroad</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="img/logo.svg">
</head>
</head>

<body>
    <header class="bg-gray-100 h-25 flex justify-between p-5">
        <img src="img/logo.svg" class="h-15 w-15">
        <div class="flex justify-between items-center gap-4">
            <img src="img/search.svg" class="h-5 w-5">
            <div class="flex gap-1 items-center">
                <img src="img/gb.svg" class="h-8 w-8 rounded-xl">
                <p>EN</p>
                <img src="img/drop.svg" class="w-5 h-5">
                <div class="hidden flex gap-1 items-centerr">
                    <img src="img/tr.svg" class="h-8 w-8 rounded-xl">
                    <p>TR</p>
                    <img src="img/drop.svg" class="w-5 h-5">
                </div>
            </div>
            <div class="links absolute flex flex-row bg-white w-screen top-[-100%] left-0">
                <ul class="block flex flex-col gap-3 font-semibold text-[18px] p-10">
                    <li>
                        <a href="#" class="text-black cursor-pointer">Home</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Universities</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Masters</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Language Schools</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Summer Schools </a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">High School </a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Become an Agent</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Partnership</a>
                    </li>
                    <li>
                        <a href="#" class="text-black cursor-pointer">Login</a>
                    </li>
                </ul>
            </div>
            <img onclick="menuClick()" src="img/menu.svg" class="h-9 w-9">
        </div>
    </header>
    <div class="w-full h-[100vh] bg-[url('img/maindiv.jpeg')] bg-cover bg-center">

    </div>

    <script>
        function menuClick() {
            const menus = document.querySelector('.links')
            menus.classList.toggle('top-[13%]')
        }
    </script>
</body>

</html>
